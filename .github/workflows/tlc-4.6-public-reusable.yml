name: TLC 4.6 public audit telemetry

on:
  workflow_call:
    inputs:
      pr_number:
        description: Live pull-request number.
        required: true
        type: number
      base_sha:
        description: Exact live pull-request base commit.
        required: true
        type: string
      head_sha:
        description: Exact live pull-request head commit.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  public-audit:
    name: TLC 4.6 public audit telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: tlc-4-6-public-${{ github.repository }}-${{ inputs.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Observe exact caller through GitHub APIs
        uses: transpara-ai/workflows/.github/actions/tlc-4.6-public@0ec4b60385bd785c4a902006d554cacbc470419b
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          repository-id: ${{ github.event.repository.id }}
          pr-number: ${{ inputs.pr_number }}
          base-sha: ${{ inputs.base_sha }}
          head-sha: ${{ inputs.head_sha }}

      - name: Preserve non-credit telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tlc46-public-${{ github.event.repository.name }}-${{ inputs.head_sha }}
          path: ${{ runner.temp }}/tlc46-public-telemetry
          if-no-files-found: error
          retention-days: 30
